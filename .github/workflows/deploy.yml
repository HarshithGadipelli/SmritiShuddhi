name: Smriti Shuddhi CI/CD (GitHub -> Cloud Run & Cloudflare)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  verify:
    name: Verify Backend Python & Frontend Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python modules
        run: |
          python -m py_compile config.py db.py app/main.py \
            app/db/supabase_adapter.py \
            app/models/fusion.py app/models/lora_sisa.py \
            app/retrieval/external_verifiers.py app/retrieval/graph_store.py \
            app/retrieval/knowledge_base.py app/retrieval/news_feed.py \
            app/retrieval/vector_store.py app/unlearning/algorithms.py \
            app/unlearning/engine.py

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync & typecheck Cloudflare Worker frontend
        working-directory: cloudflare
        run: |
          npm ci
          npm run sync
          npm run typecheck

  deploy-backend-cloudrun:
    name: Build & Deploy Backend from GitHub to Google Cloud Run
    needs: verify
    if: github.event_name != 'pull_request' && vars.GCP_PROJECT_ID != '' && secrets.GCP_SA_KEY != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Submit Cloud Build to Build & Deploy Cloud Run
        run: |
          gcloud builds submit --config cloudbuild.yaml --project "${{ vars.GCP_PROJECT_ID }}"

  deploy-frontend-cloudflare:
    name: Deploy Frontend Edge Worker to Cloudflare
    needs: verify
    if: github.event_name != 'pull_request' && secrets.CLOUDFLARE_API_TOKEN != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build & Deploy Cloudflare Worker
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          npm run deploy
