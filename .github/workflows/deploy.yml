name: Smriti Shuddhi Real-Time Git CI/CD

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'LICENSE.txt'
      - 'PROJECT_TREE.txt'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Target stack to deploy on manual run'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - frontend
          - backend

jobs:
  verify:
    name: Verify & Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.changes.outputs.backend }}
      frontend_changed: ${{ steps.changes.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed stack paths
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.deploy_target }}"
            echo "backend=$([ "$TARGET" = "both" ] || [ "$TARGET" = "backend" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            echo "frontend=$([ "$TARGET" = "both" ] || [ "$TARGET" = "frontend" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
            BACKEND=$(echo "$CHANGED" | grep -E '^(app/|config\.py|db\.py|Dockerfile|requirements\.txt|Procfile|\.python-version|project\.toml|\.dockerignore|\.gcloudignore|cloudbuild\.yaml|supabase_schema\.sql|data/|sisa_adapters/|templates/|static/|\.github/workflows/deploy\.yml)' -q && echo true || echo false)
            FRONTEND=$(echo "$CHANGED" | grep -E '^(cloudflare/|templates/|static/|\.github/workflows/deploy\.yml)' -q && echo true || echo false)
          else
            BACKEND=true
            FRONTEND=true
          fi
          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python modules
        run: |
          python -m compileall -q app config.py db.py

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync & typecheck Cloudflare Worker frontend
        working-directory: cloudflare
        run: |
          npm ci
          npm run sync
          npm run typecheck

  deploy-backend-cloudrun:
    name: Auto-Deploy Backend to Cloud Run
    needs: verify
    if: github.event_name != 'pull_request' && needs.verify.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloud Run deploy configuration
        id: gcp_cfg
        env:
          HAS_SA_KEY: ${{ secrets.GCP_SA_KEY != '' }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID || 'project-5e24ddd4-8856-4b35-aeb' }}
        run: |
          if [ "$HAS_SA_KEY" = "true" ] && [ -n "$PROJECT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Cloud Run deploy: set GCP_SA_KEY secret (and optional GCP_PROJECT_ID) in GitHub Actions."
          fi

      - name: Checkout repository
        if: steps.gcp_cfg.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        if: steps.gcp_cfg.outputs.enabled == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        if: steps.gcp_cfg.outputs.enabled == 'true'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ steps.gcp_cfg.outputs.project_id }}

      - name: Deploy Backend to Cloud Run
        if: steps.gcp_cfg.outputs.enabled == 'true'
        run: |
          if [ "${{ vars.GCP_DEPLOY_METHOD }}" = "source" ]; then
            gcloud run deploy smritishuddhi \
              --source . \
              --region=asia-south1 \
              --platform=managed \
              --allow-unauthenticated \
              --port=8080 \
              --memory=2Gi \
              --cpu=2 \
              --concurrency=40 \
              --timeout=300 \
              --min-instances=0 \
              --max-instances=3 \
              --session-affinity \
              --cpu-boost \
              --quiet \
              --project "${{ steps.gcp_cfg.outputs.project_id }}"
          else
            gcloud builds submit --config cloudbuild.yaml --project "${{ steps.gcp_cfg.outputs.project_id }}"
          fi

  deploy-frontend-cloudflare:
    name: Auto-Deploy Frontend Edge Worker
    needs: verify
    if: github.event_name != 'pull_request' && needs.verify.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare deploy configuration
        id: cf_cfg
        env:
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$HAS_CF_TOKEN" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Cloudflare deploy: set CLOUDFLARE_API_TOKEN secret in GitHub Actions."
          fi

      - name: Checkout repository
        if: steps.cf_cfg.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        if: steps.cf_cfg.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy Cloudflare Worker via Scoped API Token
        if: steps.cf_cfg.outputs.enabled == 'true'
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || '0e9d9e3453b93f963b60116f28e8368a' }}
        run: |
          npm ci
          npm run deploy
