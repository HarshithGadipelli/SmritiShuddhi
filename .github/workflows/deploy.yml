name: Smriti Shuddhi Real-Time Git CI/CD

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'LICENSE.txt'
      - 'PROJECT_TREE.txt'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Target stack to deploy on manual run'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - frontend
          - backend

jobs:
  verify:
    name: Verify & Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.changes.outputs.backend }}
      frontend_changed: ${{ steps.changes.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed stack paths
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.deploy_target }}"
            echo "backend=$([ "$TARGET" = "both" ] || [ "$TARGET" = "backend" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            echo "frontend=$([ "$TARGET" = "both" ] || [ "$TARGET" = "frontend" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          BACKEND=$(echo "$CHANGED" | grep -E '^(app/|config\.py|db\.py|Dockerfile|requirements\.txt|cloudbuild\.yaml|supabase_schema\.sql|data/)' -q && echo true || echo false)
          FRONTEND=$(echo "$CHANGED" | grep -E '^(cloudflare/|templates/|static/)' -q && echo true || echo false)
          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python modules
        run: |
          python -m py_compile config.py db.py app/main.py \
            app/db/supabase_adapter.py \
            app/models/fusion.py app/models/lora_sisa.py \
            app/retrieval/external_verifiers.py app/retrieval/graph_store.py \
            app/retrieval/knowledge_base.py app/retrieval/news_feed.py \
            app/retrieval/vector_store.py app/unlearning/algorithms.py \
            app/unlearning/engine.py

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync & typecheck Cloudflare Worker frontend
        working-directory: cloudflare
        run: |
          npm ci
          npm run sync
          npm run typecheck

  deploy-backend-cloudrun:
    name: Auto-Deploy Backend to Cloud Run
    needs: verify
    if: github.event_name != 'pull_request' && needs.verify.outputs.backend_changed == 'true' && vars.GCP_PROJECT_ID != '' && secrets.GCP_SA_KEY != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Submit Cached Cloud Build to Deploy Cloud Run
        run: |
          gcloud builds submit --config cloudbuild.yaml --project "${{ vars.GCP_PROJECT_ID }}"

  deploy-frontend-cloudflare:
    name: Auto-Deploy Frontend Edge Worker
    needs: verify
    if: github.event_name != 'pull_request' && needs.verify.outputs.frontend_changed == 'true' && secrets.CLOUDFLARE_API_TOKEN != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy Cloudflare Worker via Scoped API Token
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          npm run deploy
